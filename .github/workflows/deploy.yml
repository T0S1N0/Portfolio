name: 🚀 Deploy Portfolio to Azure

on:
  push:
    branches:
      - deploy-azure-vss
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  terraform-plan:
    name: 📋 Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🔐 Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.0

      - name: 📐 Terraform Format Check
        working-directory: ./terraform
        run: |
          echo "::group::Checking Terraform formatting"
          terraform fmt -check -recursive
          echo "::endgroup::"
          echo "✅ Format check passed"

      - name: 🔧 Terraform Init
        working-directory: ./terraform
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          TF_IN_AUTOMATION: "true"
        run: |
          echo "::group::Initializing Terraform"
          set -euo pipefail
          RG="${{ vars.TFSTATE_RESOURCE_GROUP || secrets.TFSTATE_RESOURCE_GROUP || 'rg-tfstate' }}"
          CONTAINER="${{ vars.TFSTATE_CONTAINER || secrets.TFSTATE_CONTAINER || 'tfstate' }}"
          SA="${{ vars.TFSTATE_STORAGE_ACCOUNT || secrets.TFSTATE_STORAGE_ACCOUNT }}"
          KEY="portfolio.tfstate"

          if [[ -z "${SA}" ]]; then
            SA="$(az storage account list -g "${RG}" --query "[?tags.purpose=='terraform-state'].name | [0]" -o tsv)"
          fi
          if [[ -z "${SA}" ]]; then
            echo "❌ No se pudo resolver TFSTATE_STORAGE_ACCOUNT en el RG ${RG}. Define TFSTATE_STORAGE_ACCOUNT (vars o secrets)." >&2
            echo "::endgroup::"
            exit 1
          fi

          ACCESS_KEY="$(az storage account keys list -g "${RG}" -n "${SA}" --query "[0].value" -o tsv)"
          if [[ -z "${ACCESS_KEY}" ]]; then
            echo "❌ No se pudo leer la access key del Storage Account ${SA}." >&2
            echo "::endgroup::"
            exit 1
          fi
          echo "::add-mask::${ACCESS_KEY}"

          cat > backend.hcl <<EOF
          resource_group_name  = "${RG}"
          storage_account_name = "${SA}"
          container_name       = "${CONTAINER}"
          key                  = "${KEY}"
          access_key           = "${ACCESS_KEY}"
          EOF

          terraform init -backend-config=backend.hcl
          echo "::endgroup::"
          echo "✅ Terraform initialized"

      - name: ✅ Terraform Validate
        working-directory: ./terraform
        run: |
          echo "::group::Validating Terraform configuration"
          terraform validate
          echo "::endgroup::"
          echo "✅ Configuration is valid"

      - name: 📋 Terraform Plan
        working-directory: ./terraform
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          TF_IN_AUTOMATION: "true"
        run: |
          echo "::group::Planning infrastructure changes"
          terraform plan -lock=false -out=tfplan
          echo "::endgroup::"
          echo "✅ Plan generated"

      - name: 📤 Upload TF Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1
          if-no-files-found: warn

  deploy:
    name: 🏗️ Deploy to Azure
    needs: terraform-plan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/deploy-azure-vss' && github.event_name == 'push'
    outputs:
      storage_account_name: ${{ steps.tf_outputs.outputs.storage_account_name }}
      portfolio_url: ${{ steps.tf_outputs.outputs.portfolio_url }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🔐 Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.0

      - name: 📥 Download TF Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/

      - name: 🔧 Terraform Init
        working-directory: ./terraform
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          TF_IN_AUTOMATION: "true"
        run: |
          echo "::group::Initializing Terraform"
          set -euo pipefail
          RG="${{ vars.TFSTATE_RESOURCE_GROUP || secrets.TFSTATE_RESOURCE_GROUP || 'rg-tfstate' }}"
          CONTAINER="${{ vars.TFSTATE_CONTAINER || secrets.TFSTATE_CONTAINER || 'tfstate' }}"
          SA="${{ vars.TFSTATE_STORAGE_ACCOUNT || secrets.TFSTATE_STORAGE_ACCOUNT }}"
          KEY="portfolio.tfstate"

          if [[ -z "${SA}" ]]; then
            SA="$(az storage account list -g "${RG}" --query "[?tags.purpose=='terraform-state'].name | [0]" -o tsv)"
          fi
          if [[ -z "${SA}" ]]; then
            echo "❌ No se pudo resolver TFSTATE_STORAGE_ACCOUNT en el RG ${RG}. Define TFSTATE_STORAGE_ACCOUNT (vars o secrets)." >&2
            echo "::endgroup::"
            exit 1
          fi

          ACCESS_KEY="$(az storage account keys list -g "${RG}" -n "${SA}" --query "[0].value" -o tsv)"
          if [[ -z "${ACCESS_KEY}" ]]; then
            echo "❌ No se pudo leer la access key del Storage Account ${SA}." >&2
            echo "::endgroup::"
            exit 1
          fi
          echo "::add-mask::${ACCESS_KEY}"

          cat > backend.hcl <<EOF
          resource_group_name  = "${RG}"
          storage_account_name = "${SA}"
          container_name       = "${CONTAINER}"
          key                  = "${KEY}"
          access_key           = "${ACCESS_KEY}"
          EOF

          terraform init -backend-config=backend.hcl
          echo "::endgroup::"
          echo "✅ Terraform initialized"

      - name: 🚀 Terraform Apply
        working-directory: ./terraform
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          TF_IN_AUTOMATION: "true"
        run: |
          echo "::group::Applying infrastructure changes"
          set -e
          if ! terraform apply -auto-approve tfplan 2>&1 | tee apply.log; then
            if grep -q "Error acquiring the state lock" apply.log; then
              echo "⚠️ Stale state lock detected, force-unlocking and retrying..."
              LOCK_ID=$(grep "ID:" apply.log | head -1 | sed 's/.*ID:[[:space:]]*//' | tr -d ' \n\r│')
              if [ -n "$LOCK_ID" ]; then
                terraform force-unlock -force "$LOCK_ID"
                terraform apply -auto-approve tfplan
              else
                cat apply.log
                echo "::endgroup::"
                exit 1
              fi
            else
              cat apply.log
              echo "::endgroup::"
              exit 1
            fi
          fi
          echo "::endgroup::"
          echo "✅ Infrastructure deployed"

      - name: 📤 Get Terraform outputs
        id: tf_outputs
        working-directory: ./terraform
        env:
          TF_IN_AUTOMATION: 1
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "::group::Capturing Terraform outputs"
          RAW_STORAGE=$(terraform output -raw storage_account_name 2>&1)
          RAW_URL=$(terraform output -raw portfolio_url 2>&1)
          STORAGE_ACCOUNT=$(echo "$RAW_STORAGE" | grep -oE 'st[a-z0-9]{2,22}' | awk 'length>max{max=length; s=$0} END{print s}')
          PORTFOLIO_URL=$(echo "$RAW_URL" | grep -oE 'https://[^[:space:]]+' | head -1 | sed 's/::.*//')
          echo "storage_account_name=$STORAGE_ACCOUNT" >> $GITHUB_OUTPUT
          echo "portfolio_url=$PORTFOLIO_URL" >> $GITHUB_OUTPUT
          echo "::endgroup::"
          echo "✅ Outputs captured"

      - name: 📤 Upload website files
        run: |
          echo "::group::Uploading website to Azure Storage"
          ACCOUNT_KEY=$(az storage account keys list --account-name ${{ steps.tf_outputs.outputs.storage_account_name }} --query '[0].value' -o tsv)
          az storage blob upload-batch \
            --account-name ${{ steps.tf_outputs.outputs.storage_account_name }} \
            --account-key "$ACCOUNT_KEY" \
            --destination '$web' \
            --source src/ \
            --overwrite true
          echo "::endgroup::"
          echo "✅ Website files uploaded"

      - name: 📊 Deployment Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 🎉 Deployment Complete!
          
          ### 🌐 Portfolio Website
          **Live URL:** ${{ steps.tf_outputs.outputs.portfolio_url }}
          
          ### 🏗️ Infrastructure
          - **Resource Group:** `rg-portfolio-prod`
          - **Region:** East US
          - **Storage Account:** `${{ steps.tf_outputs.outputs.storage_account_name }}`
          
          ### ✅ Next Steps
          - Visit your portfolio: [${{ steps.tf_outputs.outputs.portfolio_url }}](${{ steps.tf_outputs.outputs.portfolio_url }})
          - Check [Azure Portal](https://portal.azure.com/#@/resource/subscriptions/***/resourceGroups/rg-portfolio-prod)
          EOF
          echo "✅ Summary generated"

  validate-deployment:
    name: ✅ Validate Deployment
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/deploy-azure-vss' && github.event_name == 'push'

    steps:
      - name: 🔍 Test Website Health
        run: |
          echo "::group::Testing portfolio website"
          URL="${{ needs.deploy.outputs.portfolio_url }}"
          echo "Testing portfolio website at: ${URL}"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${URL}")
          echo "HTTP Status Code: ${HTTP_CODE}"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Website is accessible"
            echo "::endgroup::"
            exit 0
          else
            echo "❌ Website returned HTTP $HTTP_CODE"
            echo "::endgroup::"
            echo "::error::Website returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: 📊 Validation Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ✅ Validation Complete!
          
          ### 🌐 Website Status
          Portfolio is deployed and accessible:
          
          **[${{ needs.deploy.outputs.portfolio_url }}](${{ needs.deploy.outputs.portfolio_url }})**
          
          ### ✅ Health Checks
          - ✅ HTTP 200 OK
          - ✅ Website accessible
          - ✅ Static hosting enabled
          EOF
          echo "✅ Validation summary generated"
